body:
  - type: markdown
    attributes:
      value: |
        Ask anything about installing and using Glassfort. Glassfort is based
        on Arch Linux but is not supported by the Arch community, so this is
        the right place. Security problems: report them privately instead
        (SECURITY.md).
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and what happens instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Glassfort version
      description: "ISO date, or the output of `pacman -Q glassfort-desktop`."
