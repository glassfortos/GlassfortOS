# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          mapfile -t scripts < <(git ls-files scripts repo tests | while read -r f; do
            head -n1 "$f" | grep -qE '^#!.*\b(ba)?sh\b' && echo "$f"
          done)
          if ((${#scripts[@]})); then
            shellcheck "${scripts[@]}"
          fi
          # PKGBUILDs are bash without a shebang; check them too.
          mapfile -t pkgbuilds < <(git ls-files '*PKGBUILD')
          if ((${#pkgbuilds[@]})); then
            shellcheck --shell=bash --exclude=SC2034,SC2154,SC2164 "${pkgbuilds[@]}"
          fi

      - name: Relative Markdown links
        run: scripts/check-links

      - name: Python (installer backend)
        working-directory: components/glassfort-installer
        run: |
          pip install --quiet ruff pytest
          ruff check .
          ruff format --check .
          pytest -q -p no:cacheprovider

      - name: Generated theme files up to date
        run: |
          components/glassfort-theme/generate --check
          components/glassfort-branding/generate --check

  qml:
    name: qmllint (Plasma QML modules)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install qmllint and the Plasma QML modules
        # Full upgrade only - never a partial sync (CLAUDE.md §6.4).
        run: |
          pacman -Syu --noconfirm --needed git qt6-declarative plasma-workspace \
            libplasma kirigami kirigami-addons plasma-nm plasma-pa powerdevil \
            bluez-qt kpipewire kcoreaddons plasma5support

      - uses: actions/checkout@v4

      - name: qmllint
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/check-qml

  packages:
    name: Build packages (clean chroot)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Cache third-party packages
        uses: actions/cache@v4
        with:
          path: cache/third-party
          key: third-party-${{ hashFiles('components/third-party/**') }}
          restore-keys: third-party-

      - name: Start archlinux container with systemd
        run: |
          docker run -d --name arch --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            --tmpfs /run --tmpfs /tmp \
            -v "$PWD:/repo" \
            archlinux:latest /usr/lib/systemd/systemd
          # Wait until systemd is up (degraded is fine in a container).
          for _ in $(seq 30); do
            state=$(docker exec arch systemctl is-system-running 2>/dev/null || true)
            [[ $state == running || $state == degraded ]] && break
            sleep 2
          done
          echo "systemd state: $state"

      - name: Build packages
        run: docker exec arch /repo/scripts/ci-build-packages /repo /repo/cache/third-party

      - name: Stop container
        if: always()
        run: docker rm -f arch

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: out/*.pkg.tar.zst
          if-no-files-found: error

  iso:
    name: Build ISO
    runs-on: ubuntu-latest
    needs: packages
    # A desktop ISO takes long and is large: build it for main only.
    if: github.event_name != 'pull_request'
    steps:
      - name: Free disk space (preinstalled SDKs)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: out

      - name: Start archlinux container
        run: |
          docker run -d --name arch --privileged \
            -v "$PWD:/repo" archlinux:latest sleep infinity

      - name: Build ISO
        run: docker exec arch /repo/scripts/build-iso /repo /repo/out /repo/iso-out

      - name: Stop container
        if: always()
        run: docker rm -f arch

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: iso
          path: |
            iso-out/*.iso
            iso-out/SHA256SUMS
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
