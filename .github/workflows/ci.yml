name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          mapfile -t scripts < <(git ls-files scripts repo tests | while read -r f; do
            head -n1 "$f" | grep -qE '^#!.*\b(ba)?sh\b' && echo "$f"
          done)
          if ((${#scripts[@]})); then
            shellcheck "${scripts[@]}"
          fi
          # PKGBUILDs are bash without a shebang; check them too.
          mapfile -t pkgbuilds < <(git ls-files '*PKGBUILD')
          if ((${#pkgbuilds[@]})); then
            shellcheck --shell=bash --exclude=SC2034,SC2154,SC2164 "${pkgbuilds[@]}"
          fi

      - name: Relative Markdown links
        run: scripts/check-links

      - name: Generated theme files up to date
        run: |
          components/glassfort-theme/generate --check
          components/glassfort-branding/generate --check

  packages:
    name: Build packages (clean chroot)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Cache third-party packages
        uses: actions/cache@v4
        with:
          path: cache/third-party
          key: third-party-${{ hashFiles('components/third-party/**') }}
          restore-keys: third-party-

      - name: Start archlinux container with systemd
        run: |
          docker run -d --name arch --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            --tmpfs /run --tmpfs /tmp \
            -v "$PWD:/repo" \
            archlinux:latest /usr/lib/systemd/systemd
          # Wait until systemd is up (degraded is fine in a container).
          for _ in $(seq 30); do
            state=$(docker exec arch systemctl is-system-running 2>/dev/null || true)
            [[ $state == running || $state == degraded ]] && break
            sleep 2
          done
          echo "systemd state: $state"

      - name: Build packages
        run: docker exec arch /repo/scripts/ci-build-packages /repo /repo/cache/third-party

      - name: Stop container
        if: always()
        run: docker rm -f arch

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: out/*.pkg.tar.zst
          if-no-files-found: error
