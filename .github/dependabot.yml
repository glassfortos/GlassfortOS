# Keeps GitHub Actions and the helper's Rust crates current. Updates come
# as pull requests, grouped per ecosystem and week, so review stays small.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /components/glassfort-helper
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      crates:
        patterns: ["*"]
