# SPDX-License-Identifier: GPL-3.0-or-later
name: Bug report
description: Something in Glassfort does not work as it should.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please write in English if you can.
        **Security problems** do not belong here: report them privately
        (Security → Report a vulnerability), see SECURITY.md.
        **Questions** are better asked in Discussions → Q&A.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe what you saw. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open System Settings → Restore Points
        2. Click "Restore…" on …
        3. …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installer
        - Desktop (start menu, dock, control center, theme)
        - Restore Points / snapshots / boot menu
        - Updates
        - System settings and defaults
        - Boot, encryption, Secure Boot
        - Website or documentation
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Glassfort version
      description: ISO date, or the output of `pacman -Q glassfort-desktop`.
      placeholder: glassfort-desktop 0.1.0-1
  - type: input
    id: hardware
    attributes:
      label: Computer
      description: Model, or CPU and graphics card. "VM" with the program name if it is a virtual machine.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Errors from this boot, if you can get them: `journalctl -b -p err`. Remove anything private first."
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
