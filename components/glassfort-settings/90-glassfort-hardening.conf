# Glassfort kernel hardening defaults (docs/02-system.md, "Hardening").
# Override a value with a file in /etc/sysctl.d/ that sorts after this one,
# e.g. /etc/sysctl.d/99-local.conf.

# Hide kernel pointers from all users, including root without CAP_SYSLOG.
# Makes kernel exploits harder; no effect on normal desktop use.
kernel.kptr_restrict = 2

# Only privileged users may read the kernel log (dmesg). The journal is
# still readable by members of the "wheel" and "systemd-journal" groups.
kernel.dmesg_restrict = 1

# Forbid unprivileged eBPF programs, a common kernel attack surface.
# 1 = disabled and cannot be re-enabled until reboot.
kernel.unprivileged_bpf_disabled = 1

# Harden the BPF JIT against JIT spraying.
net.core.bpf_jit_harden = 2

# Processes may only ptrace their own descendants (Yama). Debuggers still
# work when they start the program; attaching to running ones needs root.
kernel.yama.ptrace_scope = 1

# Disable kexec: no loading of another kernel at runtime.
kernel.kexec_load_disabled = 1

# Strict reverse-path filtering: drop packets whose source address would
# not be routed back through the same interface (anti-spoofing).
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Ignore ICMP redirects; a desktop should not let the network change its
# routes. Also never send redirects (we are not a router).
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Refuse source-routed packets.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# SYN flood protection.
net.ipv4.tcp_syncookies = 1

# Protect against TIME-WAIT assassination (RFC 1337).
net.ipv4.tcp_rfc1337 = 1
