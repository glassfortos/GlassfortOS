# Glassfort: map the Copilot key to the assistant shortcut.
# The Copilot key sends Meta+Shift+F23, which KDE's shortcut recorder
# cannot capture (docs/03-desktop-design.md). keyd turns it into Meta+A,
# the Glassfort assistant shortcut.
[ids]
*

[main]
leftshift+leftmeta+f23 = M-a
