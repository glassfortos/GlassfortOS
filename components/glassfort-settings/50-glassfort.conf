# Glassfort defaults for limine-entry-tool (docs/02-system.md, "Boot").
# /etc/default/limine overrides these values.

# Name of the OS entry in the boot menu. Without it limine-entry-tool uses
# PRETTY_NAME from /etc/os-release ("Arch Linux"), and Glassfort's branding
# never uses the Arch name (CLAUDE.md, docs/08). limine-snapper-sync finds
# the entry by machine-id, so the snapshots stay below it.
TARGET_OS_NAME="Glassfort"

# Verify kernels and initramfs with BLAKE2B hashes in limine.conf.
# Required for Secure Boot without signing kernels (D-08).
ENABLE_VERIFICATION=yes

# Boot menu order: default kernel, LTS fallback, then snapshots.
BOOT_ORDER="linux, linux-lts, *, *fallback, Snapshots"
ENABLE_SORT=no

# Always keep EFI/BOOT/BOOTX64.EFI in sync with limine_x64.efi, so firmware
# that boots the fallback path gets the same binary (D-08).
ENABLE_LIMINE_FALLBACK=yes

# Do not add other bootloaders found on the ESP to the menu.
FIND_BOOTLOADERS=no

# Glassfort raises privileges through polkit, not sudo.
AUTH_METHOD="run0 --background="

QUIET_MODE=yes
