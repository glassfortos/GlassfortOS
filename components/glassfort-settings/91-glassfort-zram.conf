# Memory settings tuned for swap on zram (no swap partition, see
# docs/02-system.md). Values follow the recommendations for in-memory
# compressed swap: swapping to zram is cheap, so prefer it over dropping
# page cache, and read single pages instead of clusters.
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
