<!-- glassfort-helper: only root may own the name; anyone may call it.
     Every method is authorised with polkit inside the helper. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.glassfort.Helper1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.glassfort.Helper1"
           send_interface="org.glassfort.Helper1"/>
    <allow send_destination="org.glassfort.Helper1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.glassfort.Helper1"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"/>
    <allow send_destination="org.glassfort.Helper1"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="GetAll"/>
  </policy>
</busconfig>
