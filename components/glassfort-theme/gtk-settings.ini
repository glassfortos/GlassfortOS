# Default GTK theme for Glassfort. Plasma's kde-gtk-config adds the other
# keys (fonts, icons, dark preference) and keeps them in sync. In
# /etc/skel it also stops kde-gtk-config's first-login update from
# switching an empty theme setting to Breeze.
[Settings]
gtk-theme-name=Glassfort
