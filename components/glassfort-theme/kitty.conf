# Glassfort default kitty configuration (system-wide, /etc/xdg/kitty).
# kitty only reads it when the user has no ~/.config/kitty/kitty.conf.
# Colours: dark-theme.auto.conf and light-theme.auto.conf next to this
# file follow the desktop's light/dark setting (kitty 0.38+).

font_family      JetBrains Mono
font_size        11.0

background_opacity 0.92
background_blur    1
window_padding_width 8
hide_window_decorations no

tab_bar_style    powerline
tab_powerline_style round

include /usr/share/glassfort/kitty/glassfort-dark.conf
